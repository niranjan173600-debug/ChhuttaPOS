<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="iconGrad512" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bg512)"/>
  
  <!-- Outer Glow Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#818cf8" stroke-width="8" opacity="0.3"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#6366f1" stroke-width="4" opacity="0.2"/>
  
  <!-- POS / Billing Register Icon -->
  <g transform="translate(116, 100)" fill="none" stroke="url(#iconGrad512)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <!-- Store Roof Header -->
    <path d="M 20 90 L 140 20 L 260 90 L 260 120 L 20 120 Z" fill="url(#iconGrad512)" opacity="0.18" />
    <path d="M 20 90 L 140 20 L 260 90 M 20 120 L 260 120" />
    
    <!-- Main Screen Body -->
    <rect x="40" y="120" width="200" height="150" rx="20" />
    <line x1="70" y1="160" x2="210" y2="160" stroke-width="14" />
    <line x1="70" y1="195" x2="160" y2="195" stroke-width="14" />
    <circle cx="195" cy="195" r="10" fill="url(#iconGrad512)" />
    
    <!-- Cash Drawer Base -->
    <path d="M 20 270 L 260 270 L 230 310 L 50 310 Z" fill="url(#iconGrad512)" opacity="0.25" />
    <path d="M 20 270 L 260 270 L 230 310 L 50 310 Z" />
  </g>
</svg>
