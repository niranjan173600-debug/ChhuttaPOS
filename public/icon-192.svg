<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <!-- Background Card with rounded corners -->
  <rect width="192" height="192" rx="42" fill="url(#bg)"/>
  
  <!-- Outer Glow Circle -->
  <circle cx="96" cy="96" r="64" fill="none" stroke="#818cf8" stroke-width="3" opacity="0.4"/>
  
  <!-- POS / Coin Stack Icon -->
  <g transform="translate(46, 42)" fill="none" stroke="url(#iconGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- Store Roof / Front -->
    <path d="M 10 32 L 50 10 L 90 32 L 90 44 L 10 44 Z" fill="url(#iconGrad)" opacity="0.15" />
    <path d="M 10 32 L 50 10 L 90 32 M 10 44 L 90 44" />
    
    <!-- POS Terminal Box -->
    <rect x="20" y="44" width="60" height="52" rx="8" />
    <line x1="32" y1="58" x2="68" y2="58" stroke-width="6" />
    <line x1="32" y1="70" x2="52" y2="70" stroke-width="6" />
    <circle cx="64" cy="70" r="4" fill="url(#iconGrad)" />
    
    <!-- Cash Drawer -->
    <path d="M 12 96 L 88 96 L 80 106 L 20 106 Z" fill="url(#iconGrad)" opacity="0.25" />
    <path d="M 12 96 L 88 96 L 80 106 L 20 106 Z" />
  </g>
</svg>
